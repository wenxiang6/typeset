[project]
name = "paiban-api"
version = "1.0.0"
description = "地理周刊排版 · FastAPI 网关（鉴权 + PostgreSQL 存储 + 静态托管 + 管理后台）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
