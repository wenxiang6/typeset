<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>地理时政周刊 · 排版编辑器</title>
    <style>
      #paiban-boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 10px; background: #f2f2f2; color: #666;
        font: 14px/1.7 "PingFang SC", "Microsoft YaHei", sans-serif; text-align: center; padding: 24px;
      }
      #paiban-boot b { color: #222; font-size: 16px; }
      #paiban-boot code { background: #e6e6e6; padding: 2px 6px; border-radius: 3px; }
      #root:not(:empty) ~ #paiban-boot { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="paiban-boot">
      <b>排版编辑器正在加载…</b>
      <div>如果长时间停在这里，说明页面脚本没有加载成功。</div>
      <div>开发时请用 <code>pnpm dev</code> 打开；离线使用请双击构建后的 <code>dist/地理周刊-排版编辑器.html</code>。</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
